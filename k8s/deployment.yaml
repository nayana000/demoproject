apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoproject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoproject
  template:
    metadata:
      labels:
        app: demoproject
    spec:
      containers:
        - name: demoproject
          image: 890615325308.dkr.ecr.ap-south-1.amazonaws.com/demoproject:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /demoproject/health
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /demoproject/health
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 20

      nodePort: 30081


